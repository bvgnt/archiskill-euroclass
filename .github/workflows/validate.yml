name: Validation Euroclass

on:
  push:
    paths: ['tables/**', 'scripts/**']
  pull_request:
    paths: ['tables/**', 'scripts/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validation des tables
        run: python3 scripts/validate_euroclass.py
